name: CI

# What the repository asserts on every change: the canonical git hooks are
# present, no TODO or FIXME marker is committed, and the fonts rebuild from the
# UFO sources and pass the font check, and the npm package holds exactly the
# fonts, their stylesheet, their manifest and their keyboards.
#
# The build is reproducible (a fixed head timestamp), so the committed fonts,
# fonts.css and fonts.json must match a fresh build byte for byte: a file left
# unrebuilt fails here.
#
# The lexicon guards are not run here. They read the lexicon from a local
# thalorna checkout, and thalorna is private to this CI.

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    githooks:
        name: Canonical git hooks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: HeroicLands/.github/actions/githooks@f8139e8a0f414a349cd760b4c0bfbd80ab58722a # main

    todos:
        name: No TODO or FIXME markers
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: HeroicLands/.github/actions/todos@f8139e8a0f414a349cd760b4c0bfbd80ab58722a # main
              with:
                  paths: tools
                  extensions: .py

    package:
        name: Formatting and the npm package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run check:package
            - run: npm test

    fonts:
        name: Fonts build and pass the font check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Create the virtual environment
              run: |
                  python3 -m venv .venv
                  .venv/bin/pip install -r requirements.txt
            - name: Build the fonts
              run: PATH="$PWD/.venv/bin:$PATH" ./build.sh
            - name: Check the fonts
              run: |
                  .venv/bin/python tools/pirzath/check_font.py
                  .venv/bin/python tools/pirzath-hand/check_font.py
                  .venv/bin/python tools/thuravark-carved/check_font.py
                  .venv/bin/python tools/qalezu-hand/check_font.py
                  .venv/bin/python tools/khelathi-zethu-glyphs/check_font.py
                  .venv/bin/python tools/semaron-kuriale/check_font.py
                  .venv/bin/python tools/notdef_box.py
                  .venv/bin/python tools/font_names.py
                  .venv/bin/python tools/codepoints.py
                  .venv/bin/python tools/vertical.py
                  .venv/bin/python tools/spacing.py
                  .venv/bin/python tools/keyboards_guard.py --fixtures-only
                  .venv/bin/python tools/prove_guards.py
            - name: Committed fonts, stylesheet and manifest match the build
              run: |
                  git diff --exit-code -- fonts/ fonts.css fonts.json
                  test -z "$(git ls-files --others --exclude-standard -- fonts.css fonts.json)"
