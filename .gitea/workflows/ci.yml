name: CI

# What the repository asserts on every change: the canonical git hooks are
# present, no TODO or FIXME marker is committed, and the fonts rebuild from the
# UFO sources and pass the font check, and the npm package holds exactly the
# fonts, their stylesheet, their manifest and their charts, and every drawn
# Khelathi Zethu sign has a paint map whose seeds land in its regions.
#
# The build is reproducible (a fixed head timestamp), so the committed fonts,
# fonts.css and fonts.json must match a fresh build byte for byte: a file left
# unrebuilt fails here.

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    githooks:
        name: Canonical git hooks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: HeroicLands/.github/actions/githooks@0bb7fa3d15b9cad324e5c859808de7660998bfe0 # main

    todos:
        name: No TODO or FIXME markers
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: HeroicLands/.github/actions/todos@0bb7fa3d15b9cad324e5c859808de7660998bfe0 # main
              with:
                  paths: tools
                  extensions: .py

    package:
        name: Formatting and the npm package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run check:package
            - run: npm test
            - name: Check WIP workflow gating
              if: ${{ !cancelled() }}
              run: node --test tools/wip-workflows.test.mjs

    fonts:
        name: Fonts build and pass the font check
        if: ${{ !cancelled() }}
        # The build runner's 60-minute limit; the general runner's 30 is too short under load.
        runs-on: build
        steps:
            - name: Require a ready pull request
              id: ready
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  case "${PR_TITLE-}" in
                      [Ww][Ii][Pp]:*)
                          echo "WIP pull request: the long checks have not run. Remove WIP with earl pr ready." >&2
                          exit 1
                          ;;
                  esac
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && (success()) }}
            - name: Create the virtual environment
              run: |
                  python3.13 -m venv .venv
                  .venv/bin/pip install -r requirements.txt
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && (success()) }}
            - name: Build the fonts
              run: PATH="$PWD/.venv/bin:$PATH" ./build.sh
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && (success()) }}
            - name: Check the fonts
              run: .venv/bin/python tools/check.py
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && (success()) }}
            - name: Committed fonts, stylesheet, manifest and specimen pages match the build
              run: |
                  git diff --exit-code -- fonts/ fonts.css fonts.json specimens/pages/ specimens/*.md README.md
                  test -z "$(git ls-files --others --exclude-standard -- fonts.css fonts.json specimens/pages/ specimens/)"
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && (success()) }}
