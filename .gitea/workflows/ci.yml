name: CI

# What the repository asserts on every change: the canonical git hooks are
# present, no TODO or FIXME marker is committed, and the fonts rebuild from the
# UFO sources and pass the font check, and the npm package holds exactly the
# fonts, their stylesheet, their manifest, their keyboards and their encodings, every
# encoding round-trips under the standard library alone and its marks draw nothing
# in the fonts, and every drawn Khelathi Zethu sign has a paint map whose seeds land
# in its regions.
#
# The build is reproducible (a fixed head timestamp), so the committed fonts,
# fonts.css and fonts.json must match a fresh build byte for byte: a file left
# unrebuilt fails here.
#
# The lexicon guards run on their fixtures alone here, written through the
# encodings. The lexicons are read from a local thalorna checkout, and thalorna
# is private to this CI.

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    githooks:
        name: Canonical git hooks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: HeroicLands/.github/actions/githooks@d5df169d556decffa602bcfc566f1b391a57ad09 # main

    todos:
        name: No TODO or FIXME markers
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: HeroicLands/.github/actions/todos@d5df169d556decffa602bcfc566f1b391a57ad09 # main
              with:
                  paths: tools
                  extensions: .py

    package:
        name: Formatting and the npm package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run check:package
            - run: npm test

    fonts:
        name: Fonts build and pass the font check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Create the virtual environment
              run: |
                  python3.13 -m venv .venv
                  .venv/bin/pip install -r requirements.txt
            - name: Check the encodings
              run: |
                  python3.13 -m unittest tools/encode_test.py
                  python3.13 tools/encodings_guard.py
                  python3.13 tools/encoding_docs.py --check
                  python3.13 tools/khelathi-zethu-glyphs/encoding_file.py --check
                  .venv/bin/python tools/chalish-pilam/codage.py --check
            - name: Build the fonts
              run: PATH="$PWD/.venv/bin:$PATH" ./build.sh
            - name: Check the fonts
              run: |
                  .venv/bin/python tools/pirzath/check_font.py
                  .venv/bin/python tools/pirzath-hand/check_font.py
                  .venv/bin/python tools/thuravark-carved/check_font.py
                  .venv/bin/python tools/qalezu-hand/check_font.py
                  .venv/bin/python tools/khelathi-zethu-glyphs/check_font.py
                  .venv/bin/python tools/semaron-kuriale/check_font.py
                  .venv/bin/python tools/teng-chou/check_font.py
                  .venv/bin/python tools/teng-chou/guard.py --fixtures-only
                  .venv/bin/python tools/teng-chou/syllabary_distinct.py
                  .venv/bin/python tools/teng-chou/stroke_mix.py
                  .venv/bin/python tools/chalish-pilam/check_font.py
                  .venv/bin/python tools/chalish-pilam/guard.py --fixtures-only
                  .venv/bin/python tools/veldikko/check_font.py
                  .venv/bin/python tools/veldikko/guard.py --fixtures-only
                  .venv/bin/python tools/vedyakshara/check_font.py
                  .venv/bin/python tools/vedyakshara/guard.py --fixtures-only
                  .venv/bin/python tools/helonika/check_font.py
                  .venv/bin/python tools/helonika/guard.py --fixtures-only
                  .venv/bin/python tools/pirzath/guard.py --fixtures-only
                  .venv/bin/python tools/pirzath-hand/guard.py --fixtures-only
                  .venv/bin/python tools/thuravark-carved/guard.py --fixtures-only
                  .venv/bin/python tools/qalezu-hand/guard.py --fixtures-only
                  .venv/bin/python tools/semaron-kuriale/guard.py --fixtures-only
                  .venv/bin/python tools/notdef_box.py
                  .venv/bin/python tools/encodings_guard.py --require-fonts
                  .venv/bin/python tools/font_names.py
                  .venv/bin/python tools/codepoints.py
                  .venv/bin/python tools/vertical.py
                  .venv/bin/python tools/spacing.py
                  .venv/bin/python tools/keyboards_guard.py
                  .venv/bin/python tools/sample_texts.py
                  .venv/bin/python tools/khelathi-zethu-glyphs/paint_guard.py
                  .venv/bin/python tools/specimen_pages.py --check
                  .venv/bin/python tools/prove_guards.py
            - name: Committed fonts, stylesheet, manifest and specimen pages match the build
              run: |
                  git diff --exit-code -- fonts/ fonts.css fonts.json specimens/pages/ specimens/*.md README.md
                  test -z "$(git ls-files --others --exclude-standard -- fonts.css fonts.json specimens/pages/ specimens/)"
