# This YAML specifies the encoding. encode.py currently loads the JSON file.
# Mapping values name codage entries; a sequence emits those entries in order.
mappings:
    a: ANKRON_MIN
    A: ANKRON_MAJ
    e: ELZA_MIN
    E: ELZA_MAJ
    i: ILTHERA_MIN
    I: ILTHERA_MAJ
    o: ORNETHE_MIN
    O: ORNETHE_MAJ
    u: ULMERA_MIN
    U: ULMERA_MAJ
    b: BRUTHEKA_MIN
    B: BRUTHEKA_MAJ
    d: DEKAZU_MIN
    D: DEKAZU_MAJ
    f: FUNELA_MIN
    F: FUNELA_MAJ
    g: GULMOS_MIN
    G: GULMOS_MAJ
    h: HARLEN_MIN
    H: HARLEN_MAJ
    j: JA_MIN
    J: JA_MAJ
    k: KALPEZ_MIN
    K: KALPEZ_MAJ
    l: LIZELA_MIN
    L: LIZELA_MAJ
    m: MEZARA_MIN
    M: MEZARA_MAJ
    n: NELAMIS_MIN
    N: NELAMIS_MAJ
    p: POZERA_MIN
    P: POZERA_MAJ
    q: QORETHA_MIN
    Q: QORETHA_MAJ
    r: RONETHOS_MIN
    R: RONETHOS_MAJ
    s: SIRETHA_MIN
    S: SIRETHA_MAJ
    t: TALOTHOS_MIN
    T: TALOTHOS_MAJ
    v: VARTHOS_MIN
    V: VARTHOS_MAJ
    w: WA_MIN
    W: WA_MAJ
    y: YALZEMIS_MIN
    Y: YALZEMIS_MAJ
    z: ZARGON_MIN
    Z: ZARGON_MAJ
    ch: CHEROLA_MIN
    Ch: CHEROLA_MAJ
    sh: SHELMORA_MIN
    Sh: SHELMORA_MAJ
    th: THOLERA_MIN
    Th: THOLERA_MAJ
    dh: DHANETHE_MIN
    Dh: DHANETHE_MAJ
    kh: KHORVENA_MIN
    Kh: KHORVENA_MAJ
    gh: GHORMAS_MIN
    Gh: GHORMAS_MAJ
    zh: ZHAREVA_MIN
    Zh: ZHAREVA_MAJ
    ts: TSALEMA_MIN
    Ts: TSALEMA_MAJ
    ng: ENGARIS_MIN
    Ng: ENGARIS_MAJ
    "0": DIGIT_ZERO
    "1": DIGIT_ONE
    "2": DIGIT_TWO
    "3": DIGIT_THREE
    "4": DIGIT_FOUR
    "5": DIGIT_FIVE
    "6": DIGIT_SIX
    "7": DIGIT_SEVEN
    "8": DIGIT_EIGHT
    "9": DIGIT_NINE
    ".": POINT
    á: [ANKRON_MIN, STRESS]
    é: [ELZA_MIN, STRESS]
    í: [ILTHERA_MIN, STRESS]
    ó: [ORNETHE_MIN, STRESS]
    ú: [ULMERA_MIN, STRESS]
    Á: [ANKRON_MAJ, STRESS]
    É: [ELZA_MAJ, STRESS]
    Í: [ILTHERA_MAJ, STRESS]
    Ó: [ORNETHE_MAJ, STRESS]
    Ú: [ULMERA_MAJ, STRESS]

rules:
    normalization: NFC
    matching: longest-first
    case:
        single-letter: preserve
        consonant-group: lowercase-or-initial-uppercase
        other-group-cases: forbidden
    stress:
        modifier: STRESS
        position: after-stressed-vowel
        printing: false
        effect: stress-only
        changes-sound: false
        changes-length: false
        # In a recognized vowel group, the acute belongs on its first vowel.
        vowel-group-position: first-vowel
    vowel-groups:
        reading: established
        allow-splitting: false
        unrecognized-adjacent-vowels: separate
    diaeresis:
        allowed: false
    contextual-mappings:
        # Apply before the separate n and y mappings. y is never a vowel.
        - match: ny
          before: vowel
          emit: NYELIS_MIN
        - match: Ny
          before: vowel
          emit: NYELIS_MAJ
    y:
        kind: consonant
        sound: "y in yes"
        vowel-reading: false
        # Outside the contextual ny rule, n and y use their own consonant mappings.
    grave-accent:
        allowed: false
